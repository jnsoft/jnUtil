name: .NET Nuget

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_CONFIGURATION: Release
  APP_NAME: jnUtil

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration ${{ env.BUILD_CONFIGURATION }}

    - name: Test
      run: dotnet test jnUtilTests/jnUtilTests.csproj --no-build --configuration ${{ env.BUILD_CONFIGURATION }} --verbosity normal --collect "Code coverage"

    - name: Pack
      shell: pwsh
      run: dotnet pack ${{ env.APP_NAME }}/${{ env.APP_NAME }}.csproj --no-build --configuration ${{ env.BUILD_CONFIGURATION }} -p:IncludeSymbols=false --output "$env:RUNNER_TEMP/packages"

    - name: Upload package artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: ${{ runner.temp }}/packages/*.nupkg
        retention-days: 1

  publish-nuget:
    runs-on: windows-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write  # required for OIDC trusted publishing


    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Download package artifact
      uses: actions/download-artifact@v4
      with:
        name: nuget-package
        path: ${{ runner.temp }}/packages

    - name: Publish NuGet Package (Trusted Publishing)
      shell: pwsh
      run: |
        $oidcToken = (Invoke-RestMethod `
          -Uri "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" `
          -Headers @{ Authorization = "Bearer $env:ACTIONS_RUNTIME_TOKEN" }).value
        $pkgs = Get-ChildItem -Path "$env:RUNNER_TEMP/packages" -Filter *.nupkg
        if (-not $pkgs) { throw "No .nupkg files found" }
        foreach ($pkg in $pkgs) {
          Write-Host "Publishing $($pkg.Name)"
          dotnet nuget push $pkg.FullName --skip-duplicate --api-key $oidcToken --source https://api.nuget.org/v3/index.json
        }